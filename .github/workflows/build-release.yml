name: Build and Release TIPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from timestamp
        id: version
        run: |
          VERSION="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package TIPA
        id: build
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE_NAME="TrollSpeed.xcarchive"
          ARCHIVE_PRODUCTS="$ARCHIVE_NAME/Products"
          APP_NAME="Apibug-HUD.app"
          APP_PATH="$ARCHIVE_PRODUCTS/Applications/$APP_NAME"
          PAYLOAD_PATH="$ARCHIVE_PRODUCTS/Payload"
          ENTITLEMENTS_PATH="$ARCHIVE_PRODUCTS/TS.entitlements"

          xcodebuild clean build archive \
            -scheme TrollSpeed \
            -project THOR-HUD.xcodeproj \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath TrollSpeed \
            CODE_SIGNING_ALLOWED=NO

          cp supports/TS.entitlements "$ENTITLEMENTS_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found: $APP_PATH"
            exit 1
          fi

          codesign --remove-signature "$APP_PATH" || true

          rm -rf "$PAYLOAD_PATH"
          mkdir -p "$PAYLOAD_PATH"
          mv "$ARCHIVE_PRODUCTS/Applications" "$PAYLOAD_PATH/Applications"

          if command -v ldid >/dev/null 2>&1; then
            ldid -S"$ENTITLEMENTS_PATH" "$PAYLOAD_PATH/Applications/$APP_NAME"
          else
            echo "ldid not found, skipping ad-hoc re-sign step"
          fi

          ( cd "$PAYLOAD_PATH" && zip -qr ../Apibug-HUD.tipa . )
          mkdir -p packages
          mv "$ARCHIVE_PRODUCTS/Apibug-HUD.tipa" packages/ApibugSmoba.tipa

      - name: Collect build logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -d /Users/runner/Library/Logs/DiagnosticReports ]; then
            cp -R /Users/runner/Library/Logs/DiagnosticReports artifacts/ || true
          fi
          if [ -d ~/Library/Developer/Xcode/DerivedData ]; then
            find ~/Library/Developer/Xcode/DerivedData -name '*.log' -o -name '*.xcactivitylog' | while read -r f; do
              cp "$f" artifacts/ 2>/dev/null || true
            done
          fi
          if [ -d ~/Library/Logs/xcbuild ]; then
            cp -R ~/Library/Logs/xcbuild artifacts/ || true
          fi

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.version.outputs.version }}
          path: artifacts
          if-no-files-found: ignore

      - name: Verify TIPA exists
        shell: sh
        run: |
          ls -lah packages
          test -f "packages/ApibugSmoba.tipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            packages/ApibugSmoba.tipa
