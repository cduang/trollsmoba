name: Build and Release TIPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from timestamp
        id: version
        run: |
          VERSION="v$(date -u +'%Y%m%d-%H%M%S')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build TIPA
        id: build
        shell: bash
        run: |
          set -uo pipefail
          chmod +x ./build.sh
          ./build.sh "${{ steps.version.outputs.version }}"

      - name: Collect build logs on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f /Users/runner/Library/Logs/DiagnosticReports/* ]; then
            cp -R /Users/runner/Library/Logs/DiagnosticReports artifacts/ || true
          fi
          if [ -d ~/Library/Developer/Xcode/DerivedData ]; then
            find ~/Library/Developer/Xcode/DerivedData -name '*.log' -o -name '*.xcactivitylog' | while read -r f; do
              cp "$f" artifacts/ 2>/dev/null || true
            done
          fi
          if [ -d ~/Library/Logs/xcbuild ]; then
            cp -R ~/Library/Logs/xcbuild artifacts/ || true
          fi

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ steps.version.outputs.version }}
          path: artifacts
          if-no-files-found: ignore

      - name: Verify TIPA exists
        shell: sh
        run: |
          ls -lah packages
          test -f "packages/ApibugSmoba-${{ steps.version.outputs.version }}.tipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            packages/ApibugSmoba-${{ steps.version.outputs.version }}.tipa
